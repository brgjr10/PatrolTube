name: CI

# The repo had no CI at all, so the dependency-declaration drift this campaign
# fixed (PATROLTUBE-011/025) could recur silently: requirements.txt says one
# thing, the installed stack another, and the app 500s at runtime instead of at
# install time. This workflow installs the pins and then proves the app still
# serves its primary route against them.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # The Dockerfile installs the same requirements.txt, so the image and CI
      # resolve yt-dlp (and fastapi/starlette) from one source of truth and
      # cannot drift apart again. Nothing else in the build adds a dependency,
      # so a change here is the only way the two can diverge.
      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      # Drift guard. tests/test_routes.py asserts GET / and GET /mobile return
      # 200 against the *installed* stack; that is exactly the assertion that
      # would have failed on PATROLTUBE-006, where the pinned fastapi hid a
      # starlette TemplateResponse signature change that made every route 500.
      # The run is only meaningful because the install above used the pins.
      - name: Test suite
        run: python -m pytest tests -q

      - name: Byte-compile every module
        run: python -m compileall -q .
